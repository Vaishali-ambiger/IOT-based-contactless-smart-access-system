<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Smart Access & Safety Digital Twin{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/alerts.css') }}">
</head>
<body>

    <nav class="navbar">
        <a class="nav-brand" href="/">
            <span class="brand-mark">SA</span>
            <span><strong>Smart Access</strong><small>Safety digital twin</small></span>
        </a>
        <div class="nav-links">
            <a href="/" class="{% if request.path == '/' %}active{% endif %}"><span>⌂</span> Dashboard</a>
            <a href="/simulation" class="{% if request.path == '/simulation' %}active{% endif %}"><span>◈</span> Simulation</a>
            <a href="/logs" class="{% if request.path == '/logs' %}active{% endif %}"><span>▤</span> Access Logs</a>
            <a href="/alerts" class="{% if request.path == '/alerts' %}active{% endif %}"><span>!</span> Safety Alerts</a>
            <a href="/admin" class="{% if request.path == '/admin' %}active{% endif %}"><span>⚙</span> Admin</a>
        </div>
        <div class="system-pill"><i></i> System online</div>
    </nav>

    <main class="container">
        {% block content %}{% endblock %}
    </main>

    <footer class="footer">Software-only simulation <span>•</span> No physical hardware connected</footer>

    <script src="{{ url_for('static', filename='js/script.js') }}"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
